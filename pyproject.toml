[project]
name = "hybrid-ai-nwp-forecast"
version = "0.1.0"
description = "Hybrid AI-NWP forecast bias correction and decision-support system for disaster management."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "SIH Team" }
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=2.1,<3.0",
    "scikit-learn>=1.5,<2.0",
    "xgboost>=2.1,<3.0",
    "xarray>=2024.9,<2026.0",
    "cfgrib>=0.9.15,<1.0",
    "requests>=2.32,<3.0",
    "httpx>=0.27,<1.0",
    "joblib>=1.4,<2.0",
    "python-dotenv>=1.0,<2.0",
    "pyarrow>=17.0,<20.0",
    "jupyter>=1.1,<2.0",
    "matplotlib>=3.9,<4.0",
    "shap>=0.46,<1.0"
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"